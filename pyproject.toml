[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biaoshu-skill"
version = "0.1.0"
description = "Portable bid-writing Skill with deterministic tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docs = ["python-docx>=1.2", "pypdf>=5.0"]

[project.scripts]
biaoshu = "biaoshu.cli:main"

[tool.setuptools.packages.find]
include = ["biaoshu*"]
