name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    env:
      # GitHub's Windows runner may default to cp1252; CLI output is Chinese.
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.10' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: windows-latest, python-version: '3.14' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional document deps
        run: python -m pip install -e '.[docs]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: node --check biaoshu/webui/app.js
      - name: Smoke CLI
        run: python -m biaoshu --help
