name: integration-acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-release-candidate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.10' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: windows-latest, python-version: '3.14' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and document dependencies
        run: python -m pip install -e ".[docs]"
      - name: Verify full regression, fictional bid, and CLI
        run: python scripts/validate_release_candidate.py
